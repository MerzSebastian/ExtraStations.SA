; ExtraStations.SA.ini - put next to ExtraStations.SA.asi (in scripts\ or the GTA SA folder).
;
; THE RADIO CYCLE
;   The radio scrolls through a list of entries, in this order:
;       1 Playback FM   2 K-Rose   3 K-DST   4 Bounce FM   5 SF-UR   6 Radio Los Santos
;       7 Radio X       8 CSR 103.9  9 K-Jah West  10 Master Sounds 98.3  11 WCTR
;       12 User Track Player (your own music from Documents\GTA San Andreas User Files\User Tracks;
;          only there if that folder has music in it)
;       then your own stations, then "radio off".
;   Every [Station...] section below is one more entry. Its HostStation number is its place in this list,
;   and it can be any number: 13, 14, 20 ... put it after all the game's stations, 3 puts it right after
;   K-DST, 0 puts it first. Stations with the same number keep the order they have in this file.
;
; TURNING THINGS OFF
;   [Radio]
;   Disabled=2,5,12     leaves those built-in stations out of the cycle (12 = the User Track Player)
;
; YOUR STATIONS
;   Every section whose name starts with "Station" is a station: [Station1], [StationWestside] ...
;   Add as many as you like. Delete a section or put a ';' in front of every line to remove it.
;   They are played by the game's own User Track Player, so bass boost, EQ, volume and ducking all apply.
;
;   Name        shown on screen when you tune in
;   HostStation its place in the radio cycle (see above), default 13 = after all the game's stations (the safe choice).
;               A lower number puts the station between built-in ones. Nothing is replaced: the stations after it simply
;               come one step later when you scroll, and the game's own settings do not depend on the position (the
;               preselected radio of a car is the game's station number, so K-DST stays K-DST).
;               If the game ever tunes the User Track Player slot by itself, the plugin plays the station of yours that
;               you tuned last (or the first one), wherever it sits in the cycle.
;   Folder      station folder (relative to this ini / the GTA SA folder). The folders can be anywhere.
;               Audio files: .ogg .mp3 .wav .wma .wmv .aac .m4a   (the formats the game's own player accepts;
;               convert FLAC files to .ogg first)
;               SAMPLE RATE: give all the files of one station the SAME sample rate (44100 Hz is a good choice). The game cannot
;               change sample rate from one track to the next without a pause (and not without the plugin's repair at all).
;               A station whose files all share one rate is played as it is. If a station mixes rates, the plugin converts its
;               Ogg files up to the highest rate while playing (see ConvertSampleRates below). Converting the files yourself
;               beforehand is better: tools\convert-sample-rate.ps1, and docs\SAMPLE_RATES.md for the details.
;               Tracks shorter than 7 seconds are not played by the game.
;                 Folder\songs\    the music (files directly in Folder count as songs too)   [alias: music]
;                 Folder\idents\   station ids / jingles                                     [aliases: jingles, ident]
;                 Folder\ads\      adverts                                                    [aliases: adverts, ad]
;                 Folder\talk\     DJ talk, news, traffic, weather                            [aliases: dj, banter, news, weather, traffic]
;               Folder names are not case-sensitive. intros, outros and shows are reserved for later versions.
;               A folder with any other name is ignored, and the log says so.
;               What comes next follows the original game's own radio probabilities: mostly songs, now and
;               then an ident, an ad or talk.
;   Shuffle     1 random order (each track once before any repeats), 0 alphabetical
;   Idents / Ads / Talk   where those clips come from:
;                 Auto (default)  your files if the folder has any, otherwise the game's own
;                                 (the game only has generic adverts for this slot, no DJ talk or idents)
;                 Custom          only your files          Off   never
;                 Vanilla         the game's own           Mixed your files and the game's
;               (clips borrowed from another station, such as Radio Los Santos' DJ, are not available yet)


[Radio]
Disabled=
; ConvertSampleRates=0 switches the on-the-fly conversion of stations that mix sample rates off (default 1).
ConvertSampleRates=1


; ---- Your stations. Station 1 is active: put music in  scripts\ExtraStations.SA\MyStation\songs  and start the game. -----
; The release zip contains that folder with the sub folders songs, idents, ads and talk. Only songs is needed; the other
; three may stay empty. A station without any song is skipped (the log says so).
; The folders are relative to the GTA San Andreas folder (or to the folder of this ini). The log
; (scripts\ExtraStations.SA.log) tells what was found in each folder. To use the examples below, remove the ';'.

; Example 1 (active): the simplest station, just music.
[Station1]
Name=My Station
HostStation=13
Folder=ExtraStations.SA\MyStation

; Example 2: right after it in the cycle, with its own idents, ads and talk (folders ads\ idents\ talk\ next to songs\)
;[StationWestside]
;Name=Westside Mix
;HostStation=14
;Folder=ExtraStations.SA\Westside
;Ads=Off            ; never play ads on this one

; Example 3: a station placed between two of the game's. Sits right after K-DST (3) in the cycle.
;[StationRetro]
;Name=Retro Hits
;HostStation=3
;Folder=ExtraStations.SA\Retro

; ---- Debugging: leave this alone unless you are looking for a bug (docs\DEBUGGING.md) -------------------------
; The [Debug] line stays active, just remove the ';' in front of a key. Needs a restart of the game.
[Debug]
;Trace=1       logs everything that happens, with the state of the game's audio channel (large log, a few MB per hour)
;Probe=1       logs every track the game loads and every failure to load one
;Vanilla=1     no hooks at all: the game plays all tracks with its own player (tells game bugs from plugin bugs)
;NoPicker=1    the game picks the tracks itself instead of the station's deck
;NoAdHooks=1   leaves the game's own adverts alone
